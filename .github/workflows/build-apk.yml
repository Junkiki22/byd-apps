name: Build APKs

on:
  push:
    branches: [feature/japanese-localization]
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install SDK packages
        run: sdkmanager "platforms;android-29" "build-tools;34.0.0"

      - name: Ensure zip is available
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Build all apps (JA)
        run: |
          set -e
          BT="$ANDROID_SDK_ROOT/build-tools/34.0.0"
          export ANDROID_JAR="$ANDROID_SDK_ROOT/platforms/android-29/android.jar"
          export AAPT2="$BT/aapt2"
          export PATH="$BT:$PATH"
          echo "ANDROID_JAR=$ANDROID_JAR"
          for app in pet-mode door-sound engine-sound byd-probe; do
            echo "=== building $app ==="
            chmod +x "apps/$app/build.sh"
            (cd "apps/$app" && bash build.sh)
          done
          echo "=== built APKs ==="
          find apps -path '*/build/*.apk' -type f -exec ls -la {} \;

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: byd-apps-ja
          path: apps/*/build/*.apk
          retention-days: 14
